{% extends 'hotel/base.html' %}
{% block title %}Удалить промокод{% endblock %}
{% block content %}
<h2>⚠️ Удалить промокод?</h2>
<p><strong>{{ promocode.code }}</strong> - {{ promocode.discount_percent }}%</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn" style="background:#e74c3c">Да, удалить</button>
    <a href="/promocodes/" class="btn">Отмена</a>
</form>
{% endblock %}
