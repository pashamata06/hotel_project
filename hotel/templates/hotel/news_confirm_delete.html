{% extends 'hotel/base.html' %}
{% block title %}Удалить новость{% endblock %}
{% block content %}
<h2>⚠️ Удалить новость?</h2>
<p><strong>{{ news.title }}</strong></p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn" style="background:#e74c3c;">Да, удалить</button>
    <a href="/news/" class="btn">Отмена</a>
</form>
{% endblock %}
