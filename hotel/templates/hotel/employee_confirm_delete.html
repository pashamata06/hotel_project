{% extends 'hotel/base.html' %}
{% block title %}Удалить сотрудника{% endblock %}
{% block content %}
<h2>⚠️ Удалить сотрудника?</h2>
<p><strong>{{ employee.last_name }} {{ employee.first_name }}</strong> - {{ employee.get_position_display }}</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn" style="background:#e74c3c;">Да, удалить</button>
    <a href="/contacts/" class="btn">Отмена</a>
</form>
{% endblock %}
