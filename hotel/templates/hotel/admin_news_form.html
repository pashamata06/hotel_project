{% extends 'hotel/base.html' %}
{% block title %}Добавить новость{% endblock %}
{% block content %}
<h2>➕ Добавить новость</h2>
<form method="post">
    {% csrf_token %}
    <div>
        <label>Заголовок:</label><br>
        <input type="text" name="title" required>
    </div>
    <div>
        <label>Краткое описание:</label><br>
        <textarea name="short_description" required></textarea>
    </div>
    <div>
        <label>Полный текст:</label><br>
        <textarea name="full_text" required></textarea>
    </div>
    <br>
    <button type="submit" class="btn">Добавить</button>
    <a href="/news/" class="btn">Отмена</a>
</form>
{% endblock %}
